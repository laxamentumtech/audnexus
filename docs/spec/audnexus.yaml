components:
  responses:
    RateLimitExceeded:
      description: The request exceeded its rate limit.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              code: RATE_LIMIT_EXCEEDED
              message: Rate limit reached. Please try again later.
              details: null
    InternalServerError:
      description: The server returned an untyped error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FastifyErrorResponse'
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-metrics-token
      description: |
        The client sends the metrics token in `x-metrics-token`.
        The `METRICS_AUTH_TOKEN` environment variable sets this token.
    ipAuth:
      type: apiKey
      in: header
      name: x-forwarded-for
      description: |
        The server allows client IP addresses listed in `METRICS_ALLOWED_IPS`.
        The server trusts `x-forwarded-for` only when the request comes from a trusted proxy.
        The allow-list accepts comma-separated IP addresses and CIDR ranges.
        The server can use this allow-list instead of `METRICS_AUTH_TOKEN`.
  schemas:
    ErrorResponse:
      type: object
      description: The API uses this envelope for typed errors.
      properties:
        error:
          type: object
          description: This object contains the typed error details.
          properties:
            code:
              type: string
              description: This value identifies the error.
            message:
              type: string
              description: This value describes the error.
            details:
              type: object
              nullable: true
              description: This value contains an error details object or null.
              additionalProperties: true
          required:
            - code
            - message
      required:
        - error
    FastifyErrorResponse:
      type: object
      description: Fastify returns this body for untyped errors.
      properties:
        statusCode:
          type: integer
          description: This value gives the HTTP status code.
        error:
          type: string
          description: This value names the HTTP error.
        message:
          type: string
          description: This value describes the error.
      required:
        - statusCode
        - error
        - message
    HistoryTracking:
      type: object
      description: |
        HistoryTracking describes baseline coverage for one history resource.
        `pending` means that no comparable baseline exists.
        The resource can have no established state.
        `active` means that at least one field or rendition baseline exists.

        The `artwork` object lists initialized rendition baselines.
        An absent rendition key means that coverage is unknown.
        An absent key does not mean that artwork was deleted.
      properties:
        status:
          type: string
          enum: [pending, active]
        recordingEnabled:
          type: boolean
        startedAt:
          type: string
          format: date-time
          nullable: true
        fields:
          type: object
          additionalProperties:
            type: object
            properties:
              policy:
                type: string
                nullable: true
              baselineAt:
                type: string
                format: date-time
                nullable: true
        artwork:
          type: object
          description: Each key names a rendition with an initialized comparable baseline.
          additionalProperties:
            type: object
            properties:
              policy:
                type: string
              baselineAt:
                type: string
                format: date-time
      required:
        - status
        - recordingEnabled
        - fields
    Author:
      type: object
      properties:
        asin:
          type: string
        description:
          type: string
        genres:
          type: array
          items:
            $ref: '#/components/schemas/Genre'
        image:
          type: string
        name:
          type: string
        region:
          type: string
          enum:
