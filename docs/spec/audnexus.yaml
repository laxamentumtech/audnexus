openapi: 3.0.0
info:
  title: Audnexus
  description: |
    Audnexus provides audiobook data.
  contact:
    name: David Dembeck
    url: 'https://github.com/laxamentumtech/audnexus'
  license:
    name: GPL v3
    url: 'https://www.gnu.org/licenses/gpl-3.0.en.html'
  version: 1.15.2
externalDocs:
  description: The repository contains the Audnexus source code.
  url: 'https://github.com/laxamentumtech/audnexus'
servers:
  - url: 'https://api.audnex.us'
    description: The server provides the public API.
tags:
  - name: Authors
    description: The API provides author data.
  - name: Books
    description: The API provides book data.
  - name: Chapters
    description: The API provides chapter data.
  - name: Search
    description: The API searches for books and authors.
  - name: Health
    description: The API reports service health.
  - name: Metrics
    description: The API returns performance metrics.
security: []
paths:
  '/health':
    get:
      summary: The service reports its health.
      description: The endpoint reports service health and the status of MongoDB and Redis.
      operationId: getHealth
      tags:
        - Health
      responses:
        '200':
          description: The service reports a healthy status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - healthy
                  timestamp:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    properties:
                      server:
                        type: boolean
                      database:
                        type: boolean
                      redis:
                        type: boolean
                        nullable: true
              example:
                status: healthy
                timestamp: '2024-01-15T10:30:00.000Z'
                checks:
                  server: true
                  database: true
                  redis: true
        '503':
          description: The service reports an unhealthy status.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    enum:
                      - unhealthy
                  timestamp:
                    type: string
                    format: date-time
                  checks:
                    type: object
                    properties:
                      server:
                        type: boolean
                      database:
                        type: boolean
                      redis:
                        type: boolean
                        nullable: true
              example:
                status: unhealthy
                timestamp: '2024-01-15T10:30:00.000Z'
                checks:
                  server: true
                  database: false
                  redis: false
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  '/metrics':
    get:
      summary: The API returns performance metrics.
      description: |
        The response contains memory use, uptime, and request statistics.
        Authentication applies when `METRICS_AUTH_TOKEN` or `METRICS_ALLOWED_IPS` is configured.
        The endpoint is public when both values are unset.
      operationId: getMetrics
      tags:
        - Metrics
      responses:
        '200':
          description: The response contains the requested metrics.
          content:
            application/json:
              schema:
                type: object
                properties:
                  memory:
                    type: object
                    properties:
                      used:
                        type: number
                        description: The amount of heap memory in MB.
                      total:
                        type: number
                        description: The total heap size in MB.
                      external:
                        type: number
                        description: The external memory use in MB.
                      rss:
                        type: number
                        description: The resident set size in MB.
                  uptime:
                    type: number
                    description: The server uptime in seconds.
                  requests:
                    type: object
                    additionalProperties:
                      type: object
                      properties:
                        count:
                          type: number
                          description: This value gives the number of requests to this endpoint.
                        duration:
                          type: number
                          description: This value gives the total duration in milliseconds.
                        min:
                          type: number
                          description: This value gives the minimum request duration in milliseconds.
                        max:
                          type: number
                          description: This value gives the maximum request duration in milliseconds.
                        avg:
                          type: number
                          description: This value gives the average request duration in milliseconds.
                example:
                  memory:
                    used: 45.23
                    total: 128.0
                    external: 12.5
                    rss: 95.8
                  uptime: 86400
                  requests:
                    '/books/{ASIN}':
                      count: 1500
                      duration: 45000
                      min: 10
                      max: 500
                      avg: 30
                    '/health':
                      count: 500
                      duration: 2500
                      min: 2
                      max: 20
                      avg: 5
        '403':
          description: The request failed authentication.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Forbidden
        '404':
          description: The metrics endpoint is disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
              example:
                error: Metrics endpoint disabled
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      security:
        - ApiKeyAuth: []
        - ipAuth: []
    parameters: []
  '/books/search':
    get:
      summary: The API searches for books.
      description: The endpoint returns up to 10 full book records that match `q`.
      operationId: searchBooks
      tags:
        - Search
      parameters:
        - name: q
          in: query
          required: true
          description: This value contains the search text. Empty text returns 400.
          schema:
            type: string
            minLength: 1
        - name: region
          in: query
          required: false
          description: This value selects the Audible catalog region.
          schema:
            type: string
            enum: [au, ca, de, es, fr, in, it, jp, us, uk]
            default: us
      responses:
        '200':
          description: The response contains up to 10 books that match `q`.
          content:
            application/json:
              schema:
                type: array
                maxItems: 10
                items:
                  $ref: '#/components/schemas/Book'
        '400':
          description: |
            The API returns 400 when `q` is missing, blank, or not a string.
            The API also returns 400 for an unsupported `region`.
            An unsupported `region` returns `Unknown region: <value>`.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
                required:
                  - error
                  - message
              example:
                error: Bad Request
                message: q is required
        '500':
          description: The upstream service returned an error.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastifyErrorResponse'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  '/books/{ASIN}':
    get:
      summary: The API returns a book.
      description: The endpoint returns one book.
      operationId: getBookById
      parameters:
        - name: name
          in: query
          description: This value can contain an author name.
          required: false
          schema:
            type: string
            minLength: 2
        - name: update
          in: query
          description: The value `1` requests an upstream data refresh.
          required: false
          schema:
            type: string
            enum: ['0', '1']
        - name: region
          in: query
          description: This value selects the Audible catalog region.
          required: false
          schema:
            type: string
            enum: [au, ca, de, es, fr, in, it, jp, us, uk]
            default: us
      responses:
        '200':
          description: The response contains one book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Book'
              examples:
                B08G9PRS1K:
                  value:
                    asin: B08G9PRS1K
                    authors:
                      - asin: B00G0WYW92
                        name: Andy Weir
                    copyright: 2021
                    description: "Ryland Grace is the sole survivor on a desperate, last-chance mission - and if he fails, humanity and the Earth itself will perish. Except that right now, he doesn't know that. He can't even remember his own name, let alone the nature of his assignment or how to complete it...."
                    formatType: unabridged
                    genres:
                      - asin: '18580606011'
                        name: Science Fiction & Fantasy
                        type: genre
                      - asin: '18580628011'
                        name: Science Fiction
                        type: tag
                      - asin: '18580629011'
                        name: Adventure
                        type: tag
                      - asin: '18580639011'
                        name: Hard Science Fiction
                        type: tag
                      - asin: '18580645011'
                        name: Space Opera
                        type: tag
                    image: 'https://m.media-amazon.com/images/I/91vS2L5YfEL.jpg'
                    isAdult: false
                    isbn: '9781603935470'
                    language: english
                    literatureType: fiction
                    narrators:
                      - name: Ray Porter
                    publisherName: Audible Studios
                    rating: '4.9'
                    ratings:
                      value: '4.9'
                      numRatings: 158505
                      numReviews: 18832
                      distribution:
                        five: 141378
                        four: 14019
                        three: 2262
                        two: 558
                        one: 288
                      performanceDistribution:
                        five: 136044
                        four: 7138
                        three: 1126
                        two: 237
                        one: 185
                      storyDistribution:
                        five: 125817
                        four: 14956
                        three: 2467
                        two: 619
                        one: 318
                    region: us
                    releaseDate: '2021-05-04T00:00:00.000Z'
                    runtimeLengthMin: 970
                    summary: "<p><b><i>Winner of the 2022 Audie Awards' Audiobook of the Year</i></b></p> <p><b><i>Number-One Audible and </i></b><b>New York Times</b><b><i> Audio Best Seller</i></b></p> <p><b><i>More than one million audiobooks sold</i></b></p> <p><b>A lone astronaut must save the earth from disaster in this incredible new science-based thriller from the number-one </b><b><i>New York Times</i></b><b> best-selling author of </b><b><i>The Martian</i></b><b>.</b></p> <p>Ryland Grace is the sole survivor on a desperate, last-chance mission - and if he fails, humanity and the Earth itself will perish.</p> <p>Except that right now, he doesn't know that. He can't even remember his own name, let alone the nature of his assignment or how to complete it.</p> <p>All he knows is that he's been asleep for a very, very long time. And he's just been awakened to find himself millions of miles from home, with nothing but two corpses for company.</p> <p>His crewmates dead, his memories fuzzily returning, he realizes that an impossible task now confronts him. Alone on this tiny ship that's been cobbled together by every government and space agency on the planet and hurled into the depths of space, it's up to him to conquer an extinction-level threat to our species.</p> <p>And thanks to an unexpected ally, he just might have a chance.</p> <p>Part scientific mystery, part dazzling interstellar journey, <i>Project Hail Mary</i> is a tale of discovery, speculation, and survival to rival <i>The Martian</i> - while taking us to places it never dreamed of going.</p> <p>PLEASE NOTE: To accommodate this audio edition, some changes to the original text have been made with the approval of author Andy Weir.</p>"
                    title: Project Hail Mary
        '400':
          description: The ASIN or query values are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The book does not exist.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            History mode returns 409 when an unresolved identity conflict exists for the requested `ASIN` and `region`.
            Duplicate rows for the exact region cause this conflict.
            A row for the exact region and a row without a region or with an unsupported region also cause this conflict.
            The conflict blocks a forced `update=1` refresh.
            The API serves a stored book without a forced update.
            Legacy mode returns 200 with the stale data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      tags:
        - Books
    delete:
      summary: The API deletes a book.
      operationId: deleteBook
      parameters:
        - name: name
          in: query
          description: This value can contain an author name.
          required: false
          schema:
            type: string
            minLength: 2
        - name: region
          in: query
          description: This value selects the Audible catalog region.
          required: false
          schema:
            type: string
            enum: [au, ca, de, es, fr, in, it, jp, us, uk]
            default: us
      responses:
        '200':
          description: The request succeeded.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
        '400':
          description: The ASIN or query values are invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: |
            The book does not exist.
            In history mode, a concurrent delete can remove the book before this request.
            The API does not delete a book that is already absent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FastifyErrorResponse'
        '409':
          description: |
            History mode returns 409 when an unresolved identity conflict exists for the requested `ASIN` and `region`.
            Duplicate rows for the exact region cause this conflict.
            A row for the exact region and a row without a region or with an unsupported region also cause this conflict.
            The conflict blocks the delete.
            Legacy mode deletes the found row and returns 200.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
      description: The API deletes one book.
      tags:
        - Books
    parameters:
      - schema:
          type: string
        name: ASIN
        in: path
        required: true
        description: This value identifies the book by its Audible ASIN.
  '/books/{ASIN}/artwork':
    get:
      summary: The API returns artwork for a book.
      description: |
        The endpoint returns retained artwork for one exact `ASIN` and `region` pair.
        Items appear newest first by immutable sequence.
        The response lists parsed and unparsed references.
        An unparsed reference has a null `imageId`.
        Live references return their URLs as received.
        A live unparsed reference returns its exact URL in a `renditions` entry.

        A legacy reference returns the server-stored URL and import time in `legacy`.
        A legacy reference has an empty `renditions` array.
        The API does not expose a legacy URL through a rendition entry.

        The endpoint reads retained data.
        It can return data after the current book is deleted.
        A pending trusted current book returns 200 with an empty `items` array.
        An unresolved identity conflict returns 409 only when no established history state exists.
        An established state takes precedence and returns 200.

        An unknown resource returns 404.
        Invalid path or query input returns 400.
      operationId: getBookArtwork
      tags:
        - Books
      parameters:
        - name: ASIN
          in: path
          required: true
          description: This value identifies the book by its Audible ASIN.
          schema:
            type: string
        - name: region
          in: query
          required: false
          description: This value selects the Audible catalog region.
          schema:
            type: string
            enum: [au, ca, de, es, fr, in, it, jp, us, uk]
            default: us
        - name: limit
          in: query
          required: false
          description: This value sets the page size.
          schema:
            type: string
            pattern: '^\d{1,3}$'
            description: The page size ranges from 1 to 100. The API reads this value as a decimal digit string.
            default: '50'
        - name: cursor
          in: query
          required: false
          description: |
            This opaque keyset cursor continues a previous page.
            The cursor applies to the exact `ASIN` and `region` pair that issued it.
            A cursor for another pair returns 400.
          schema:
            type: string
            maxLength: 2048
      responses:
        '200':
          description: The response lists artwork. A pending resource has no items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  asin:
                    type: string
                  region:
                    type: string
                  tracking:
                    $ref: '#/components/schemas/HistoryTracking'
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      properties:
                        assetId:
                          type: string
                        imageId:
                          type: string
                          nullable: true
                        legacy:
                          type: object
                          nullable: true
                          properties:
                            storedUrl:
                              type: string
                            importedAt:
                              type: string
                              format: date-time
                            observedAt:
                              type: string
                              nullable: true
                              description: The value is always null for legacy imports.
                            rendition:
                              type: string
                              nullable: true
                              description: The value is always null for legacy imports.
                        renditions:
                          type: array
                          items:
                            type: object
                            properties:
                              rendition:
                                type: string
                              firstSourceUrl:
                                type: string
                              sourceUrl:
                                type: string
                              firstObservedAt:
                                type: string
                                format: date-time
                              observedAt:
                                type: string
                                format: date-time
                  nextCursor:
                    type: string
                    nullable: true
        '400':
          description: |
            The request has an invalid ASIN, limit, region, or query key.
            The cursor can be invalid, too long, or belong to another book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No retained history state or trusted current book exists for this `ASIN` and `region`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            An unresolved identity conflict exists for this `ASIN` and `region`.
            This error applies only before the history state exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  '/books/{ASIN}/similar':
    get:
      summary: The API returns similar books.
      description: |
        The endpoint returns upstream `RawSimilarities` ASINs for a book.
        It removes duplicate ASINs and returns no more than 50.
        The `expand=books` option returns compact book summaries for those ASINs.
        An empty similar list returns `books: []`.
        The endpoint skips the bulk fetch for that response.
      operationId: getBookSimilar
      tags:
        - Books
      parameters:
        - name: ASIN
          in: path
          required: true
          description: This value identifies the book by its Audible ASIN.
          schema:
            type: string
        - name: region
          in: query
          required: false
          description: This value selects the Audible catalog region.
          schema:
            type: string
            enum: [au, ca, de, es, fr, in, it, jp, us, uk]
            default: us
        - name: expand
          in: query
          required: false
          description: The `books` value requests compact book summaries.
          schema:
            type: string
            enum: [books]
      responses:
        '200':
          description: The response contains similar ASINs and optional book summaries.
          content:
            application/json:
              schema:
                type: object
                properties:
                  asin:
                    type: string
                  region:
                    type: string
                  similarAsins:
                    type: array
                    items:
                      type: string
                  expanded:
                    type: boolean
                  books:
                    type: array
                    items:
                      $ref: '#/components/schemas/Book_summary'
        '400':
          description: The request has an invalid ASIN, region, `expand` value, or query key.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  '/books/{ASIN}/history':
    get:
      summary: The API returns book history.
      description: |
        The endpoint returns stored metadata and artwork history for one exact `ASIN` and `region` pair.
        The endpoint sorts revisions from newest to oldest.
        Each item identifies a revision and lists its changed fields.
        The detail endpoint returns the full stored delta for a revision.
        The optional `field` parameter limits results to revisions that changed that field.

        The endpoint reads retained data.
        It can return data after the current book is deleted.
        An established resource returns 200.
        A pending trusted current book returns 200 with empty items and pending tracking.

        An unresolved identity conflict returns 409 only when no established history state exists.
        An established retained state takes precedence and returns 200.
        An unknown resource returns 404.

        An invalid cursor on an established resource returns 400.
        An unknown resource returns 404 before the endpoint validates the cursor.
      operationId: getBookHistory
      tags:
        - Books
      parameters:
        - name: ASIN
          in: path
          required: true
          description: This value identifies the book by its Audible ASIN.
          schema:
            type: string
        - name: region
          in: query
          required: false
          description: This value selects the Audible catalog region.
          schema:
            type: string
            enum: [au, ca, de, es, fr, in, it, jp, us, uk]
            default: us
        - name: limit
          in: query
          required: false
          description: This value sets the number of revisions on one page.
          schema:
            type: string
            pattern: '^\d{1,3}$'
            description: The page size ranges from 1 to 100. The API reads this value as a decimal digit string.
            default: '50'
        - name: cursor
          in: query
          required: false
          description: |
            This opaque keyset cursor continues a previous page.
            The cursor applies to the exact `ASIN` and `region` pair that issued it.
            It also applies to the `field` filter, when present.
            A cursor for another pair or filter returns 400.
          schema:
            type: string
            maxLength: 2048
        - name: field
          in: query
          required: false
          description: The `field` value selects revisions that changed that field.
          schema:
            type: string
            enum:
              - title
              - subtitle
              - authors
              - narrators
              - publisherName
              - description
              - summary
              - isbn
              - language
              - formatType
              - copyright
              - releaseDate
              - runtimeLengthMin
              - seriesPrimary
              - seriesSecondary
              - genres
              - tags
              - literatureType
              - isAdult
              - artwork
      responses:
        '200':
          description: The response lists history revisions. A pending resource has no items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  asin:
                    type: string
                  region:
                    type: string
                  tracking:
                    $ref: '#/components/schemas/HistoryTracking'
                  items:
                    type: array
                    maxItems: 100
                    items:
                      type: object
                      properties:
                        revision:
                          type: string
                        observedAt:
                          type: string
                          format: date-time
                        changedFields:
                          type: array
                          items:
                            type: string
                  nextCursor:
                    type: string
                    nullable: true
        '400':
          description: |
            The request has an invalid ASIN, limit, region, `field` value, or query key.
            The cursor can be invalid, too long, or belong to another book or filter.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: No history state or trusted current book exists for this `ASIN` and `region`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: |
            An unresolved identity conflict exists for this `ASIN` and `region`.
            This error applies only before the history state exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
  '/books/{ASIN}/history/{revision}':
    get:
      summary: The API returns a history revision.
      description: |
        The endpoint returns the full stored delta for one revision of an exact `ASIN` and `region` pair.
        The revision must be a positive safe integer without leading zeros.
        An unknown, cross-book, cross-region, or not-yet-existing revision returns 404.
        This rule also applies to a pending resource.
      operationId: getBookHistoryRevision
      tags:
        - Books
      parameters:
        - name: ASIN
          in: path
          required: true
          description: This value identifies the book by its Audible ASIN.
          schema:
            type: string
        - name: revision
          in: path
          required: true
          description: The revision must be a positive safe integer without leading zeros.
          schema:
            type: string
            pattern: '^[1-9][0-9]*$'
        - name: region
          in: query
          required: false
          description: This value selects the Audible catalog region.
          schema:
            type: string
            enum: [au, ca, de, es, fr, in, it, jp, us, uk]
            default: us
      responses:
        '200':
          description: The response contains the stored revision delta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  asin:
                    type: string
                  region:
                    type: string
                  revision:
                    type: number
                  observedAt:
                    type: string
                    format: date-time
                  changedFields:
                    type: array
                    items:
                      type: string
                  policies:
                    type: object
                    properties:
                      fields:
                        type: object
                        additionalProperties:
                          type: string
                      artwork:
                        type: object
                        additionalProperties:
                          type: string
                  changes:
                    type: object
                    description: |
                      Editorial field keys map to objects with `before` and `after` values.
                      The optional `artwork` key maps to ordered rendition transitions.
                      Each transition includes `rendition`, `before`, and `after`.
                      The `before` and `after` objects contain `imageId` and `sourceUrl`.
                      The first observation initializes baselines without a revision entry.
                      Every recorded artwork transition has a non-null `before` value.
                    additionalProperties: true
        '400':
          description: The ASIN, revision, region, or query values are invalid.
