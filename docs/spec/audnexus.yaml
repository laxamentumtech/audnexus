  '/books/backfill-ratings':
    post:
      summary: The API starts a ratings backfill.
      description: |
        The endpoint selects stored books that lack `ratings`, are not marked `ratingsBackfillSkip`, and do not have `rating` set to `0.0` or `0`.
        It persists rating counts and star distributions.
        The endpoint requires an admin token.
        The endpoint runs only when `UPDATE_STATS` is `1`.

        The endpoint returns `202` at once.
        It runs the backfill in the background.
        The final summary lists total, updated, skipped, and failed counts.
        The endpoint logs the summary and does not return it.

        Pre-order books have a future `releaseDate`.
        The backfill reports those books as `skipped`.
        The backfill does not persist refreshed data before release.
        A pre-order book cannot count as updated.

        One backfill runs or waits in the queue at a time.
        The queue-wide limit persists across API restarts.
        A concurrent request normally returns `409`.
        A request that reaches job-ID deduplication before the in-progress check returns `202` with the same job ID.
      operationId: backfillRatings
      tags:
        - Books
      parameters:
        - name: x-admin-token
          in: header
          description: |
            This header carries the admin token.
            The `ADMIN_TOKEN` environment variable sets this token.
          required: true
          schema:
            type: string
      responses:
        '202':
          description: |
            The endpoint returns `202` at once.
            The endpoint runs the backfill in the background.
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  id:
                    type: string
                    description: This value is the BullMQ job ID for the queued backfill.
                example:
                  message: Ratings backfill started
                  id: backfill-ratings
        '401':
          description: The admin token is missing or invalid.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: Unauthorized
                message: Invalid admin token
        '409':
          description: A backfill is already queued or in progress.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: Conflict
                message: Backfill already in progress
        '404':
          description: The backfill endpoint is disabled.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: Not Found
                message: Route not available
        '503':
          description: |
            Redis is missing or not ready, so the endpoint cannot queue the backfill.
            When Redis is ready but returns an error, the endpoint returns 500.
            A 503 from a queue-add deadline does not prove that the job was not queued.
            A later request can return 409.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                  message:
                    type: string
              example:
                error: Service Unavailable
                message: Backfill requires a ready Redis connection
        '500':
          $ref: '#/components/responses/InternalServerError'
        '429':
          $ref: '#/components/responses/RateLimitExceeded'
