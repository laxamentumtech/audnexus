# Deploy to Coolify after CI builds and pushes :latest.

name: Coolify Deploy

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

jobs:
  deploy:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read

    steps:
      - name: Decide whether a fresh Docker image shipped
        id: image-check
        env:
          GH_TOKEN: ${{ github.token }}
          CI_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          CONCLUSION=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${CI_RUN_ID}/jobs" --paginate \
            --jq '.jobs[] | select(.name == "docker-build") | .conclusion' | tail -n1)
          if [ "${CONCLUSION:-}" = "success" ]; then
            echo "deploy=true"  >> "$GITHUB_OUTPUT"
          else
            echo "CI run ${CI_RUN_ID}: docker-build=${CONCLUSION:-absent} — not deploying"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to Coolify
        if: steps.image-check.outputs.deploy == 'true'
        run: |
          response_body=$(mktemp)
          response=$(curl -s -o "$response_body" -w "%{http_code}" --max-time 30 --request GET '${{ secrets.COOLIFY_WEBHOOK }}' \
            --header 'Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}')
          if [ "$response" -ne 200 ] && [ "$response" -ne 202 ]; then
            echo "Coolify deployment failed with status: $response"
            echo "Response body:"
            cat "$response_body"
            rm -f "$response_body"
            exit 1
          fi
          rm -f "$response_body"
          echo "Coolify deployment triggered successfully"
