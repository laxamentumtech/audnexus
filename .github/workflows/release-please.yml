name: release-please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag (e.g. v1.0.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  ai-changelog:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@692973e3d937129bcbf40652eb9f2f61becf3332 # v4
        with:
          fetch-depth: 0

      - name: Resolve tag and previous tag
        id: tags
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            CURRENT_TAG="${INPUT_TAG_NAME}"
          else
            CURRENT_TAG="${{ needs.release-please.outputs.tag_name }}"
          fi
          # Find the tag immediately before CURRENT_TAG (sorted ascending, take last before it)
          PREV_TAG=$(git tag --sort=version:refname | grep -B1 -Fx "${CURRENT_TAG}" | grep -v -Fx "${CURRENT_TAG}" | head -1 || true)
          # Delete any newer tags locally so the action's auto-detect doesn't pick them up
          git tag --sort=version:refname | grep -Fx -A9999 "${CURRENT_TAG}" | tail -n +2 | xargs -r git tag -d || true
          if [ -z "${PREV_TAG}" ]; then
            # No previous tag — create a synthetic v0.0.0 at the root commit
            ROOT_COMMIT=$(git rev-list --max-parents=0 HEAD)
            git tag v0.0.0 "${ROOT_COMMIT}"
            PREV_TAG="v0.0.0"
          fi
          echo "current=${CURRENT_TAG}" >> "$GITHUB_OUTPUT"
          echo "prev=${PREV_TAG}" >> "$GITHUB_OUTPUT"
          echo "Current tag: ${CURRENT_TAG}"
          echo "Previous tag: ${PREV_TAG:-<none, first release>}"

      - uses: nosovj/llm-release-action@aba906f1ff5d376390d9e751bf407f40971079e0 # v1
        id: llm
        with:
          model: openai/${{ vars.OPENAI_MODEL || 'gpt-4o-mini' }}
          current_version: ${{ steps.tags.outputs.prev }}
          head_ref: ${{ steps.tags.outputs.current }}
          max_commits: '100'
          temperature: '0.3'
          max_tokens: '12000'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}

      - name: Update GitHub Release with AI changelog
        run: |
          CHANGELOG=$(jq -r '.default.en' <<< "$LLM_CHANGLOGS" 2>/dev/null) || true
          if [ -z "$CHANGELOG" ] || [ "$CHANGELOG" = "null" ]; then
            echo "No changelog generated, keeping default release notes"
            exit 0
          fi
          gh release edit "${{ steps.tags.outputs.current }}" --notes "$CHANGELOG"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_CHANGLOGS: ${{ steps.llm.outputs.changelogs }}
