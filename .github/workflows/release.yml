# gitflow: releases are cut on each develop -> main merge; develop pushes do NOT release.
# Annalist fill_after mode: the GitHub App fills release notes via webhook after creation.
# No ANNALIST_URL or ANNALIST_ADMIN_TOKEN required.

name: Release

on:
  push:
    branches: [main]
    paths-ignore: ['*.md', 'docs/**', '.github/**']
  workflow_dispatch:
    inputs:
      version:
        description: "Explicit version (vX.Y.Z). Empty = auto-bump from commits."
        required: false
        default: ""
      bump:
        description: "Bump level when version is empty: auto|patch|minor|major"
        required: false
        default: auto

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify lint, test, and build
        run: bun run lint:check && bun run test && bun run build

      - name: Determine next version
        id: version
        env:
          VERSION_INPUT: ${{ inputs.version }}
          BUMP_INPUT: ${{ inputs.bump }}
        run: |
          set -euo pipefail
          VERSION_INPUT="${VERSION_INPUT}"
          BUMP_INPUT="${BUMP_INPUT}"

          LATEST_TAG=$(git tag -l "v*.*.*" --sort=-version:refname | head -n 1 || true)

          if [ -n "$VERSION_INPUT" ]; then
            NEW_VERSION="${VERSION_INPUT#v}"
            if ! [[ "$NEW_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Invalid version input: ${VERSION_INPUT} (expected vX.Y.Z)"
              exit 1
            fi
            NEW_VERSION="v${NEW_VERSION}"
          elif [ -z "$LATEST_TAG" ]; then
            NEW_VERSION="v0.1.0"
          else
            MAJOR="${LATEST_TAG#v}"; MAJOR="${MAJOR%%.*}"
            REST="${LATEST_TAG#v*.}"; MINOR="${REST%%.*}"; PATCH="${REST#*.}"

            case "$BUMP_INPUT" in
              auto|"")
                if [ -z "$(git log --format=%H "${LATEST_TAG}..HEAD" 2>/dev/null)" ]; then
                  PREV_TAG=$(git tag -l "v*.*.*" --sort=-version:refname | sed -n 2p || true)
                  echo "new_version=${LATEST_TAG}" >> "$GITHUB_OUTPUT"
                  echo "previous_tag=${PREV_TAG:-}" >> "$GITHUB_OUTPUT"
                  echo "No commits since ${LATEST_TAG} — reusing it"
                  exit 0
                fi
                LOG=$(git log --format=%B "${LATEST_TAG}..HEAD" 2>/dev/null || true)
                if echo "$LOG" | grep -qE 'BREAKING CHANGE:|^[a-z]+(\([^)]*\))?!: '; then LEVEL=major
                elif echo "$LOG" | grep -qE '^feat(\([^)]*\))?: '; then LEVEL=minor
                else LEVEL=patch; fi
                ;;
              patch|minor|major) LEVEL="$BUMP_INPUT" ;;
              *) echo "Invalid bump input: ${BUMP_INPUT} (auto|patch|minor|major)"; exit 1 ;;
            esac

            case "$LEVEL" in
              major) MAJOR=$((MAJOR+1)); MINOR=0; PATCH=0 ;;
              minor) MINOR=$((MINOR+1)); PATCH=0 ;;
              patch) PATCH=$((PATCH+1)) ;;
            esac
            NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          fi

          echo "new_version=${NEW_VERSION}" >> "$GITHUB_OUTPUT"
          echo "previous_tag=${LATEST_TAG:-}" >> "$GITHUB_OUTPUT"
          echo "New version: ${NEW_VERSION} (previous: ${LATEST_TAG:-none})"

      - name: Bump package.json version
        run: |
          set -euo pipefail
          V="${{ steps.version.outputs.new_version }}"
          V="${V#v}"
          CURRENT=$(jq -r '.version' package.json)
          if [ "$CURRENT" = "$V" ]; then
            echo "package.json already at $V, skipping bump"
          else
            npm version "$V" --no-git-tag-version
            git add package.json
            git commit -m "chore(release): ${V}"
            git push origin HEAD
          fi

      - name: Create and push tag
        id: tag
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          if git rev-parse "refs/tags/${VERSION}" >/dev/null 2>&1; then
            echo "Tag ${VERSION} already exists, skipping"
            echo "created=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git tag -a "${VERSION}" -m "Release ${VERSION}"
          git push origin "${VERSION}"
          echo "created=true" >> "$GITHUB_OUTPUT"

      - name: Build and push release Docker image
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"
          REGISTRY="ghcr.io/${{ github.repository }}"

          if ! docker manifest inspect "${REGISTRY}:${VERSION}" 2>/dev/null; then
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker build --build-arg VERSION="${VERSION}" -t "${REGISTRY}:${VERSION}" .
            docker push "${REGISTRY}:${VERSION}"
            echo "Pushed ${REGISTRY}:${VERSION}"
          else
            echo "Docker image ${REGISTRY}:${VERSION} already exists, skipping"
          fi
          # NOTE: Dockerfile must define ARG VERSION to receive this stamp.
          # Add ARG VERSION=devel and use it (e.g. RUN echo "v${VERSION}" > /app/VERSION) to enable version stamping.

      - name: Create release (fill_after — annalist GitHub App fills notes)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.new_version }}"

          if gh release view "${VERSION}" >/dev/null 2>&1; then
            echo "Release ${VERSION} already exists — nothing to do"
            exit 0
          fi

          gh release create "${VERSION}" \
            --title "Release ${VERSION}"
          echo "Release ${VERSION} created (annalist will fill notes via webhook)"
