name: Deploy Docs

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync OpenAPI version with package.json
        run: |
          VERSION=$(jq -r '.version' package.json)
          # Update version in OpenAPI spec (info.version field, 2-space indent)
          sed -i "/^info:/,/^[^ ]/{s/^  version: .*/  version: ${VERSION}/}" docs/spec/audnexus.yaml
          echo "Set OpenAPI version to $VERSION"
          # Verify the change
          grep -A10 "^info:" docs/spec/audnexus.yaml | grep "version:"

      - name: Build docs
        run: bun run build-docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: 'docs'

  deploy:
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
