name: Deploy Docs
run-name: ${{ inputs.release_run && format('Release docs {0}', inputs.release_run) || format('Docs {0}', github.ref_name) }}

on:
  # No tag-push trigger: tag pushes bypass the paths filter, so an unverified
  # tag could deploy unverified docs. Exact-tag release builds arrive through
  # the explicit workflow_dispatch release path with release_run correlation.
  push:
    branches: [main, develop]
    paths: ['docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag; empty derives a tag or dev/source identity'
        required: false
        default: ''
      source:
        description: 'Expected release source SHA'
        required: false
        default: ''
      release_run:
        description: 'Release orchestration correlation ID'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      publish: ${{ steps.publish.outputs.allowed }}
      # A stale main build (docs change followed by a non-docs commit) deploys
      # nothing, and no push trigger follows the non-docs commit, so a separate
      # reconcile job dispatches a current-main run for it. Develop previews
      # and current-main sources never need reconciliation.
      reconcile: ${{ steps.publish.outputs.reconcile }}
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp the actual docs release identity
        env:
          # A release dispatch builds from main (the github-pages environment
          # policy admits only main), so stamp it with the tag-shaped release
          # ref; non-release dispatches keep their own ref. The release
          # identity itself is proven by the release-docs job's stamp step.
          DOCS_REF: ${{ inputs.release_run != '' && format('refs/tags/{0}', inputs.version) || github.ref }}
          DOCS_SOURCE: ${{ github.sha }}
          DOCS_EXPECTED_SOURCE: ${{ inputs.release_run != '' && '' || inputs.source }}
          DOCS_VERSION: ${{ inputs.version }}
        run: bun scripts/stamp-docs-version.ts

      - name: Build docs
        run: bun run build-docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Keep old retries and develop previews out of production Pages
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')
          if [[ "$SOURCE" == "$current" && "$SOURCE_REF" != refs/heads/develop ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'Docs artifact built; a stale release/develop preview does not replace production Pages.'
          fi
          # Only a stale main build needs reconciliation: a develop preview
          # deploys nothing by design and a current-main source just deployed.
          if [[ "$SOURCE_REF" == refs/heads/main && "$SOURCE" != "$current" ]]; then
            echo 'reconcile=true' >> "$GITHUB_OUTPUT"
          else
            echo 'reconcile=false' >> "$GITHUB_OUTPUT"
          fi

  # The only step in the whole workflow that needs contents:write is the
  # immutable release docs-asset publication, so it lives in its own gated
  # job instead of raising build-docs to contents:write. Run identity is
  # proven by release.py (the tag must point at the frozen source), so no
  # main-freshness re-check is needed here — the asset is immutable.
  release-docs:
    runs-on: ubuntu-latest
    needs: build-docs
    if: inputs.release_run != ''
    permissions:
      contents: write
    steps:
      # The run's own github.sha is the main head at dispatch time, which on a
      # delayed-source retry is newer than the frozen release source; the
      # immutable asset must be built from inputs.source, never github.sha.
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The release dispatch runs from main (the github-pages environment
      # policy admits only main), so the stamped version comes from the
      # reserved release identity in the inputs, not the dispatched ref: a
      # tag-shaped DOCS_REF with the frozen source proves the exact release
      # and fails closed on any drift.
      - name: Stamp the actual docs release identity
        env:
          DOCS_REF: refs/tags/${{ inputs.version }}
          DOCS_SOURCE: ${{ inputs.source }}
          DOCS_EXPECTED_SOURCE: ${{ inputs.source }}
          DOCS_VERSION: ${{ inputs.version }}
        run: bun scripts/stamp-docs-version.ts

      - name: Build docs
        run: bun run build-docs

      - name: Publish immutable version docs for release dispatches
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ inputs.source }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py docs-asset --source "$SOURCE" --version "$VERSION"

  deploy:
    runs-on: ubuntu-latest
    needs: build-docs
    if: needs.build-docs.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      # The reconciliation step triggers a fresh current-main run via the
      # workflow dispatch API; every other job stays least-privilege.
      actions: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Re-read the actual current main immediately before deploying. A newer
      # main (or a develop source) means a fresher build is already in flight
      # or owned by main, so this run intentionally deploys nothing; the
      # deploy-pages step stays skipped and is never counted as deployed.
      - name: Verify the source is current main before deploying
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')
          if [[ "$SOURCE" == "$current" && "$SOURCE_REF" != refs/heads/develop ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'Source stale relative to main at the deploy boundary; skipping Pages deployment.'
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.freshness.outputs.allowed == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.0

      # If main advanced while this run built/deployed, trigger a fresh
      # current-main reconciliation run (fire-and-forget; the dispatched run
      # re-checks main itself and cannot loop).
      - name: Reconcile if main advanced during this deployment
        if: ${{ steps.freshness.outputs.allowed == 'true' && steps.deployment.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')
          if [[ "$current" != "$SOURCE" ]]; then
            echo "Main advanced to ${current}; dispatching a fresh current-main docs reconciliation."
            gh workflow run deploy-docs.yml --ref main --repo "$GH_REPO"
          fi

      # Two staleness windows require reconciliation: build-stage staleness
      # (source stale when the build ran) is covered by the separate
      # reconcile job, and deploy-gate staleness (main advanced between the
      # build-stage check and the freshness gate above) is covered by this
      # step, because a skipped deployment leaves no post-deploy step to fire.
      # Mutually exclusive with that step: allowed=false here versus
      # allowed=true with deployment success there. allowed=false would also
      # match a develop source, but this job only runs for publish=true runs,
      # which are current-main builds, so dispatch targets main only, never
      # develop. Fire-and-forget; the dispatched run re-checks main itself.
      - name: Reconcile stale source at the deploy gate
        if: ${{ steps.freshness.outputs.allowed == 'false' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Source is stale relative to main at the deploy gate; dispatching a fresh current-main docs run."
          gh workflow run deploy-docs.yml --ref main --repo "$GH_REPO"

  # A stale main build (docs change followed by a non-docs commit) reaches the
  # deploy job's freshness gate with allowed=false, so it cannot reconcile
  # itself. This job dispatches a current-main docs run instead: the
  # dispatched run freezes its own SHA and re-evaluates the same boundary, so
  # it re-dispatches only when main advances again — never a loop.
  # Fire-and-forget, and outside the pages concurrency group and the
  # github-pages environment: blocking on the dispatched run would inherit the
  # shared concurrency group and deadlock against it.
  reconcile:
    runs-on: ubuntu-latest
    needs: build-docs
    if: needs.build-docs.outputs.reconcile == 'true'
    permissions:
      actions: write
      contents: read
    steps:
      - name: Dispatch a current-main docs build
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          echo "Source is stale relative to current main; dispatching a fresh current-main docs build."
          gh workflow run deploy-docs.yml --ref main --repo "$GH_REPO"
