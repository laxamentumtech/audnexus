name: Deploy Docs
run-name: ${{ inputs.release_run && format('Release docs {0}', inputs.release_run) || format('Docs {0}', github.ref_name) }}

on:
  push:
    branches: [main, develop]
    tags: ['v*']
    paths: ['docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag; empty derives a tag or dev/source identity'
        required: false
        default: ''
      source:
        description: 'Expected release source SHA'
        required: false
        default: ''
      release_run:
        description: 'Release orchestration correlation ID'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.publish.outputs.allowed }}
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp the actual docs release identity
        env:
          DOCS_REF: ${{ github.ref }}
          DOCS_SOURCE: ${{ github.sha }}
          DOCS_EXPECTED_SOURCE: ${{ inputs.source }}
          DOCS_VERSION: ${{ inputs.version }}
        run: bun scripts/stamp-docs-version.ts

      - name: Build docs
        run: bun run build-docs

      - name: Publish immutable version docs for release dispatches
        if: inputs.release_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py docs-asset --source "$SOURCE" --version "$VERSION"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Keep old retries and develop previews out of production Pages
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')
          if [[ "$SOURCE" == "$current" && "$SOURCE_REF" != refs/heads/develop ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'Docs artifact built; a stale release/develop preview does not replace production Pages.'
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-docs
    if: needs.build-docs.outputs.publish == 'true'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.0
