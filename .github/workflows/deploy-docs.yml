name: Deploy Docs

on:
  push:
    branches:
      - main
      - develop
    paths:
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@67b25f52d2a3e7255c9594b3134e1e4c63a79e1b # v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Sync OpenAPI version with package.json
        run: |
          VERSION=$(jq -r '.version' package.json)
          # Update version in OpenAPI spec (info.version field, 2-space indent)
          sed -i "/^info:/,/^[^ ]/{s/^  version: .*/  version: ${VERSION}/}" docs/spec/audnexus.yaml
          echo "Set OpenAPI version to $VERSION"
          # Verify the change
          grep -A10 "^info:" docs/spec/audnexus.yaml | grep "version:"

      - name: Build docs
        run: bun run build-docs

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: 'docs'

  deploy:
    runs-on: ubuntu-latest
    needs: build-docs
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5
