name: Deploy Docs
run-name: ${{ inputs.release_run && format('Release docs {0}', inputs.release_run) || format('Docs {0}', github.ref_name) }}

on:
  # No tag-push trigger: tag pushes bypass the paths filter, so an unverified
  # tag could deploy unverified docs. Exact-tag release builds arrive through
  # the explicit workflow_dispatch release path with release_run correlation.
  push:
    branches: [main, develop]
    paths: ['docs/**']
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag; empty derives a tag or dev/source identity'
        required: false
        default: ''
      source:
        description: 'Expected release source SHA'
        required: false
        default: ''
      release_run:
        description: 'Release orchestration correlation ID'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false
  queue: max

jobs:
  build-docs:
    runs-on: ubuntu-latest
    # contents:write covers the immutable release docs-asset publication.
    permissions:
      contents: write
    outputs:
      publish: ${{ steps.publish.outputs.allowed }}
    steps:
      - name: Checkout frozen source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Stamp the actual docs release identity
        env:
          DOCS_REF: ${{ github.ref }}
          DOCS_SOURCE: ${{ github.sha }}
          DOCS_EXPECTED_SOURCE: ${{ inputs.source }}
          DOCS_VERSION: ${{ inputs.version }}
        run: bun scripts/stamp-docs-version.ts

      - name: Build docs
        run: bun run build-docs

      - name: Publish immutable version docs for release dispatches
        if: inputs.release_run != ''
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE: ${{ github.sha }}
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release.py docs-asset --source "$SOURCE" --version "$VERSION"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs

      - name: Keep old retries and develop previews out of production Pages
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')
          if [[ "$SOURCE" == "$current" && "$SOURCE_REF" != refs/heads/develop ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'Docs artifact built; a stale release/develop preview does not replace production Pages.'
          fi

  deploy:
    runs-on: ubuntu-latest
    needs: build-docs
    if: needs.build-docs.outputs.publish == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Re-read the actual current main immediately before deploying. A newer
      # main (or a develop source) means a fresher build is already in flight
      # or owned by main, so this run intentionally deploys nothing; the
      # deploy-pages step stays skipped and is never counted as deployed.
      - name: Verify the source is current main before deploying
        id: freshness
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')
          if [[ "$SOURCE" == "$current" && "$SOURCE_REF" != refs/heads/develop ]]; then
            echo 'allowed=true' >> "$GITHUB_OUTPUT"
          else
            echo 'allowed=false' >> "$GITHUB_OUTPUT"
            echo 'Source stale relative to main at the deploy boundary; skipping Pages deployment.'
          fi

      - name: Deploy to GitHub Pages
        id: deployment
        if: steps.freshness.outputs.allowed == 'true'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.0

      # If main advanced while this run built/deployed, trigger a fresh
      # current-main reconciliation run. The new run freezes its own SHA on
      # dispatch and repeats these same boundary checks; dispatching inside
      # the shared pages concurrency group would deadlock, so use the Present
      # workflow dispatch API, never waiting for the reconciliation here.
      - name: Reconcile if main advanced during this deployment
        if: ${{ steps.freshness.outputs.allowed == 'true' && steps.deployment.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE: ${{ github.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GH_REPO}/branches/main" --jq '.commit.sha')
          if [[ "$current" != "$SOURCE" ]]; then
            echo "Main advanced to ${current}; dispatching a fresh current-main docs reconciliation."
            gh workflow run deploy-docs.yml --ref main --repo "$GH_REPO"
          fi
