# Generated by setup-ci. Mirrors ci.yml — edit the ci.yml/tool map, not these commands.
# A git commit --no-verify bypass is still caught by ci.yml.
repos:
  - repo: local
    hooks:
      - id: prettier-check
        name: Prettier format check
        entry: bun run lint
        language: system
        types: [javascript]
        pass_filenames: false

      - id: bun-build
        name: Bun TypeScript build
        entry: bun run build
        language: system
        types: [javascript]
        pass_filenames: false

      - id: bun-test
        name: Bun test
        entry: bun run test
        language: system
        types: [javascript]
        pass_filenames: false
