services:
  node-server:
    image: ${AUDNEXUS_IMAGE:-ghcr.io/laxamentumtech/audnexus:develop}
    restart: always
    environment:
      ADP_TOKEN: ${ADP_TOKEN}
      BOOK_HISTORY_ENABLED: ${BOOK_HISTORY_ENABLED:-false}
      MAX_REQUESTS: ${MAX_REQUESTS:-300}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/audnexus}
      PRIVATE_KEY: ${PRIVATE_KEY}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis-cache:6379}
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-432000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-30}
      UPDATE_THRESHOLD: ${UPDATE_THRESHOLD:-7}
    ports:
      - '3000:3000'
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-3}
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://127.0.0.1:3000/health || exit 1']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Queue and rate-limit state remain durable/control Redis; document cache is
  # separate and disposable. The worker health check probes both roles.
  node-worker:
    image: ${AUDNEXUS_IMAGE:-ghcr.io/laxamentumtech/audnexus:develop}
    restart: unless-stopped
    command: ['bun', 'run', 'worker']
    environment:
      ADP_TOKEN: ${ADP_TOKEN}
      BOOK_HISTORY_ENABLED: ${BOOK_HISTORY_ENABLED:-false}
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/audnexus}
      PRIVATE_KEY: ${PRIVATE_KEY}
      REDIS_CACHE_URL: ${REDIS_CACHE_URL:-redis://redis-cache:6379}
      REDIS_CACHE_TTL_SECONDS: ${REDIS_CACHE_TTL_SECONDS:-432000}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      UPDATE_INTERVAL: ${UPDATE_INTERVAL:-30}
      UPDATE_THRESHOLD: ${UPDATE_THRESHOLD:-7}
      SCHEDULER_CONCURRENCY: ${SCHEDULER_CONCURRENCY:-5}
      SCHEDULER_BATCH_SIZE: ${SCHEDULER_BATCH_SIZE:-1000}
      SCHEDULER_ITEM_TIMEOUT_MS: ${SCHEDULER_ITEM_TIMEOUT_MS:-120000}
      SCHEDULER_MAX_ITEMS: ${SCHEDULER_MAX_ITEMS:-0}
      RATE_LIMIT_COOLDOWN_BASE_MS: ${RATE_LIMIT_COOLDOWN_BASE_MS:-120000}
      RATE_LIMIT_COOLDOWN_MAX_MS: ${RATE_LIMIT_COOLDOWN_MAX_MS:-7200000}
      JITTER_MS: ${JITTER_MS:-0-5000}
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-3}
    healthcheck:
      test:
        - 'CMD-SHELL'
        - >-
          bun -e '(async () => { const { Redis } = await import("ioredis"); for (const url of [process.env.REDIS_URL, process.env.REDIS_CACHE_URL]) { if (!url) process.exit(1); const r = new Redis(url, { lazyConnect: true, connectTimeout: 3000, maxRetriesPerRequest: 1, retryStrategy: () => null }); r.on("error", () => process.exit(1)); await r.ping(); r.disconnect(); } process.exit(0) })().catch(() => process.exit(1))'
      interval: 30s
      timeout: 6s
      retries: 3
      start_period: 10s

  mongo:
    image: ${MONGO_IMAGE:-mongo:9.0.8@sha256:1444adda2e4b8d6a0d7f242a625d834a78d6e3aa6e4ed1b0b4c2dab2318c5e3d}
    restart: always
    command: ['mongod', '--wiredTigerCacheSizeGB', '${MONGO_WIREDTIGER_CACHE_GB:-1.0}']
    volumes:
      - /mnt/docker/mongo/data:/data/db
    networks:
      - internal
    ports:
      - '127.0.0.1:27017:27017'
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-3}
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', "db.adminCommand('ping')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  redis:
    image: ${REDIS_IMAGE:-redis:8.6-alpine@sha256:91c71f9ea78fa3fe268ff832a985c48e592244f707993773f8b3e1b244ac1137}
    restart: always
    command:
      - redis-server
      - --appendonly
      - 'yes'
      - --appendfsync
      - everysec
      - --save
      - '900'
      - '1'
      - --save
      - '300'
      - '10'
      - --save
      - '60'
      - '10000'
      - --maxmemory
      - ${REDIS_CONTROL_MAXMEMORY:-128mb}
      - --maxmemory-policy
      - noeviction
      - --dir
      - /data
    volumes:
      - redis-data:/data
    networks:
      - internal
    ports:
      - '127.0.0.1:6379:6379'
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-3}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

  redis-cache:
    image: ${REDIS_CACHE_IMAGE:-redis:8.6-alpine@sha256:91c71f9ea78fa3fe268ff832a985c48e592244f707993773f8b3e1b244ac1137}
    restart: always
    command:
      - redis-server
      - --save
      - ''
      - --appendonly
      - 'no'
      - --maxmemory
      - ${REDIS_CACHE_MAXMEMORY:-512mb}
      - --maxmemory-policy
      - allkeys-lfu
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: ${CONTAINER_LOG_MAX_SIZE:-10m}
        max-file: ${CONTAINER_LOG_MAX_FILES:-3}
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s

volumes:
  redis-data:

networks:
  internal:
